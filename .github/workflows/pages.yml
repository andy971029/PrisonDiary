# push 到 main 就重新打包並發布到 GitHub Pages。
# mapleexp.zip 是打包產物、不進 git，所以要在這裡用 build_web.py 現做。
# 只發布網頁真正會載入的檔案（頁面、資料 JSON、圖片與提示音效），src/、tests/ 這些不必放上網站。
# 檔案數也要壓低：GitHub Pages 檔案一多就常卡在 syncing_files，所以怪物、NPC、小地圖的圖要先併包（scripts/pack_images.py）。
# 紙娃娃（web/avatar.json、web/avatar/）不在這裡：太大會讓部署卡住，另外由 scripts/publish_avatar.py 推到 PrisonDiary-avatar。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連續 push 時只留最後一次部署，舊的直接取消。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 測試沒過就不發布，免得把壞掉的版本給朋友用。
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t tests

      - name: Build site
        run: |
          python scripts/build_web.py
          mkdir _site
          cp web/index.html web/bridge.py web/mapvocab.json web/monsterbook.json web/itembook.json web/questbook.json web/npcbook.json web/mapbook.json web/worldmap.json web/mapleexp.zip web/favicon.png web/favicon-32.png _site/
          cp -r web/sounds _site/
          cp -r web/goddess _site/
          cp -r web/icons _site/
          # 怪物、NPC、小地圖兩千多張散圖會讓部署卡在 syncing_files，併成十幾個包再放上去
          python scripts/pack_images.py web _site
          cp -r web/worldmap _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 網站超過 100 MB 之後（紙娃娃），GitHub 那邊偶爾卡在 syncing_files 不動：正常 1～5 分鐘就好，卡住的等再久也不會好。
      # 同一個 job 裡再部署一次也沒用（要排在卡住的那次後面），只能失敗後重新 push 一次，所以等到 10 分鐘上限就放棄。
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
